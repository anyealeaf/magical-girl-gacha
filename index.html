<!--
  图片一律**不带 Referer**（用户 2026-09-19 合并贡献者 PR #3 的那条修复）。

  为什么必须这样：静态站的卡面走 Gitee 镜像，而 Gitee 对带 Referer 的请求
  直接回 403 `{"code":"40310014","msg":"invalid Referer header"}` ——
  浏览器默认会给跨域图片带上来源页，于是**镜像从来没生效过**，每张图都白等一次
  403 再回退到慢线路（这正是作者报的「卡面加载缓慢、甚至加载不出来」的成因之一）。

  这一行管住**所有**子资源请求（`<img>`、CSS 里的 `background-image`、
  fetch/XHR、SW 注册），包括那些没法逐个加属性的地方；下面那些
  `referrerpolicy="no-referrer"` 则是逐元素的第二道保险（万一这个 meta 被
  某个代理/压缩器吞掉，或者以后有人把页面嵌到别处）。
-->
<meta name="referrer" content="no-referrer">

  都集中在那里，改卡不改别处。
  抽卡动画再单独一个 reveal.css —— 它是自成一体的弹层，不该混进卡面样式。
-->
<!--
  运行时配置：服务端在返回这一页时把下面那个占位符换成真实 JSON；
  静态导出时由 export-static.mjs 写死（backend:false, readonly:true）。

  ⚠️ 注释里**绝对不能出现那个占位符的字面量** —— 服务端用的是
  html.replace(占位符, json)，而它只替换第一处。注释里写一遍，替换就会落在
  注释上、真正的占位符留在原地，页面拿到的是坏配置，而且不报任何错。
  （这个坑真踩过：注入的 JSON 跑进了 HTML 注释里。）

  用 <script type="application/json"> 而不是内联 <script> 的原因：页面的 CSP 是
  script-src 'self'（没有 unsafe-inline），任何内联脚本都会被浏览器**静默拒掉**，
  但 JSON 脚本块不算脚本，CSP 不管它。
-->
<script type="application/json" id="gacha-config">{"base":"","api":"","unlocked":false,"hasKey":false,"backend":false,"readonly":true}</script>

<body>

<div id="announce" class="sr-only" aria-live="polite"></div>

<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="#/draw" data-bind="brand">
      <!-- brand-mark 是纯装饰（固定的一颗星），没有 data-bind ——
           挂了绑定但没人写它就是误导，见下面编辑对话框的说明 -->
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-text" data-bind="brand-title">魔法少女抽卡</span>
    </a>
    <nav class="nav" data-bind="nav" aria-label="主导航"></nav>
    <div class="bar-right">
      <span class="warn-chip" data-bind="warning" hidden></span>
      <!--
        一键加载图片：GitHub Pages 不允许自定义响应头，图片只有 max-age=600，
        所以「先把图抓好」必须是读者能主动按的一个动作。
        放在顶栏是因为顶栏是 sticky 的 —— 滚到哪都在，不用先滑到页脚。
        按下去就地显示进度（12/158），不弹对话框；明细、强制重新下载与
        清理缓存在页脚的「缓存设置」里。
      -->
      <button
        type="button"
        class="btn ghost small cache-load"
        data-bind="cache-load"
        title="把本站全部图片抓到本地，之后打开就不用重新下载了"
      >加载图片</button>
      <!-- 缓存管理（明细 / 强制重下 / 清理）也放顶栏：页脚那个入口要滑到最底下才看得见 -->
      <button
        type="button"
        class="btn ghost small"
        data-bind="cache-top"
        title="图片缓存明细、强制重新下载、清理缓存"
      >缓存管理</button>
      <button type="button" class="shard-chip" data-bind="shard-chip" hidden></button>
      <!-- 点数：普通抽卡的次数（每天登陆 +300，可累积） -->
      <span class="points-chip" data-bind="points-chip" hidden></span>
      <span class="cur-chip" data-bind="currency" hidden></span>
      <button type="button" class="btn ghost" data-bind="lock-btn" hidden>锁定</button>
      <button type="button" class="btn ghost" data-bind="unlock-btn" hidden>解锁</button>
    </div>
  </div>
</header>

<main id="view" class="view" data-bind="view"></main>

<footer class="foot">
  <div class="foot-inner">
    <span data-bind="foot-note"></span>
    <span class="foot-right">
      <!--
        图片缓存：GitHub Pages 不允许自定义响应头，图片只拿到 max-age=600，
        所以这里给读者一个「一次抓好 / 清掉重来」的入口。见 page/sw.js。
        顶栏那个「加载图片」是一键版；这里放状态、强制重新下载与清理。
      -->
      <button type="button" class="btn ghost small" data-bind="cache-btn">缓存设置</button>
      <span class="foot-meta" data-bind="foot-meta"></span>
    </span>
  </div>
</footer>

<dialog id="cache-dialog" class="dialog">
  <div class="dialog-form">
    <h3 class="dialog-title">图片缓存</h3>
    <p class="dialog-hint" data-bind="cache-hint"></p>
    <div class="cache-stat" data-bind="cache-stat"></div>
    <div class="dialog-actions">
      <button type="button" class="btn primary" data-bind="cache-fill">缓存全部图片</button>
      <button type="button" class="btn" data-bind="cache-force">强制重新下载</button>
      <button type="button" class="btn" data-bind="cache-clear">清理缓存</button>
      <button type="button" class="btn ghost" data-bind="cache-close">关闭</button>
    </div>
    <!--
      「清空缓存」= 重置存档（碎片/卡牌/点数/券全部清空 + 赠送三张纪念卡）。
      与上面的**图片**缓存是两件事，所以单独一块、按钮用危险色。
      点了之后进另一个对话框做二级确认，而且要等 5 秒才能按确认（用户要求）。
    -->
    <div class="cache-danger">
      <div class="cache-danger-title">清空缓存（重置存档）</div>
      <p class="cache-danger-hint">
        清空已拥有的卡牌与碎片，点数重置为 300、抽卡券重置为 20 张，
        并赠送全部纪念卡（每张同时拥有平闪 / 全闪 / 红碎）。抽卡记录、保底与追梦计数一并清零。
      </p>
      <button type="button" class="btn danger" data-bind="reset-open">清空缓存</button>
    </div>
  </div>
</dialog>

<!-- 二级确认：要等 5 秒才能点「确认清除」（用户要求） -->
<dialog id="reset-dialog" class="dialog reset-dialog">
  <div class="dialog-form">
    <h3 class="dialog-title">确认清空缓存？</h3>
    <p class="dialog-hint">
      这一步会清空你**所有**的卡牌、碎片、点数与抽卡券，并把进度重置成新号：
      点数 300、抽卡券 20 张，另外赠送全部纪念卡（每张同时拥有平闪 / 全闪 / 红碎）。
      <strong>无法撤销。</strong>
    </p>
    <div class="reset-count" data-bind="reset-count"></div>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-bind="reset-cancel">取消</button>
      <button type="button" class="btn danger" data-bind="reset-confirm" disabled>确认清除</button>
    </div>
    <div class="panel-out" data-bind="reset-out"></div>
  </div>
</dialog>

<!--
  公告弹窗：**每次打开网站最多弹一次**（用户要求）。

  触发条件：收藏里没有集齐全部纪念卡。纪念卡只通过「重置存档」赠送 ——
  它们不进任何卡池，也不能用碎片合成，所以缺了就只剩重置这一条路，
  这个弹窗就是那条路的入口。

  「每次打开最多一次」由 page.js 的 noticeOnce 把关：内存标记（同一次打开里
  任何一次重画都不会再弹）+ sessionStorage（同一标签页刷新也不再弹）。
  用户按掉之后不会再被骚扰，下次打开网站才会重新判断。
-->
<dialog id="notice-dialog" class="dialog notice-dialog">
  <div class="dialog-form">
    <h3 class="dialog-title" data-bind="notice-title">公告</h3>
    <p class="dialog-hint" data-bind="notice-lead"></p>
    <div class="notice-list" data-bind="notice-list"></div>
    <div class="notice-warn" data-bind="notice-warn"></div>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-bind="notice-later">以后再说</button>
      <button type="button" class="btn danger" data-bind="notice-reset">去重置领取</button>
    </div>
  </div>
</dialog>

<dialog id="unlock-dialog" class="dialog">
  <form method="dialog" class="dialog-form">
    <h3 class="dialog-title">输入编辑秘钥</h3>
    <p class="dialog-hint">
      没有秘钥也能看、能抽；输对了才能改卡池与后台。
    </p>
    <label class="field">
      <span class="field-label">秘钥</span>
      <input type="password" data-bind="key-input" autocomplete="off" spellcheck="false">
    </label>
    <div class="alert" data-bind="key-error" hidden></div>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-bind="key-cancel">取消</button>
      <button type="button" class="btn primary" data-bind="key-submit">解锁</button>
    </div>
  </form>
</dialog>

<!--
  这里原本还有一个「编辑条目」对话框（editor-dialog），但后端从来没有实现它 ——
  编辑是通过后台管理的行内表单 + 选图对话框完成的。

  一个挂着 data-bind 却没人填充的元素，比没有它更糟：它让 HTML 看起来支持一个
  其实不存在的功能。所以整块删掉了。scripts/test-repo.mjs 里有一条断言守着这件事：
  page.html 里每个 data-bind 都必须真的被 page.js 用到。
-->

<dialog id="pick-dialog" class="dialog wide">
  <form method="dialog" class="dialog-form">
    <h3 class="dialog-title">从受控目录里选图</h3>
    <p class="dialog-hint" data-bind="pick-hint"></p>
    <label class="field">
      <span class="field-label">搜索</span>
      <input type="text" data-bind="pick-search" placeholder="输入角色名/文件名的一部分" autocomplete="off">
    </label>
    <div class="pick-grid" data-bind="pick-grid"></div>
    <div class="alert" data-bind="pick-error" hidden></div>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-bind="pick-cancel">关闭</button>
    </div>
  </form>
</dialog>

<dialog id="card-dialog" class="dialog card-dialog">
  <div class="dialog-form">
    <h3 class="dialog-title" data-bind="card-dialog-name">卡牌</h3>
    <div class="card-dialog-chips" data-bind="card-dialog-chips"></div>
    <div class="card-dialog-figure">
      <!--
        检视用的卡片容器：拖动它换角度（page.js 写 --tilt-x/--tilt-y/--pointer-*）。
        闪卡的几层光效（.foil-shine / .foil-glare / .foil-sparks）由 page.js 按
        「这张卡拥有哪种工艺」动态插进来 —— 没有工艺时它就是一张普通的图。
      -->
      <div class="card-dialog-card card-inspect" data-bind="card-dialog-card">
        <!-- draggable="false"：不然按下拖动会变成浏览器自带的「拖这张图」，
             检视手势直接被抢走（page.js 里另有 dragstart 兜底） -->
        <img class="card-dialog-img" data-bind="card-dialog-img" alt="" draggable="false" referrerpolicy="no-referrer">
        <!--
          动态卡面（HR）：这张卡配了视频时用它，否则藏起来用上面那张静态图。
          muted + loop + playsinline 是能自动播放的三个前提（少一个浏览器就不播）；
          poster 由 page.js 设成静态卡面，视频还没就绪时不至于是一片空白。
          preload="metadata"：先只取头信息，别一打开弹层就下整段视频。
        -->
        <video
          class="card-dialog-video"
          data-bind="card-dialog-video"
          muted
          loop
          playsinline
          preload="metadata"
          draggable="false"
          hidden
        ></video>
        <div class="card-dialog-nofile" data-bind="card-dialog-nofile" hidden>这张卡还没有卡面图</div>
      </div>
    </div>
    <!-- 特殊工艺切换：只列自己拥有的（没拥有过的工艺不显示效果，也没什么可切的） -->
    <div class="card-dialog-foils" data-bind="card-dialog-foils"></div>
    <div class="card-dialog-inspect" data-bind="card-dialog-inspect" hidden></div>
    <div class="card-dialog-owner" data-bind="card-dialog-owner"></div>
    <!--
      合成按钮：兑卡已从「同档随机」改为「指定」，所以「换哪一张」就在这里定。
      按钮的可用性由 page/shards.js 的 canSynthesize 判断（与服务端同一份规则）。
    -->
    <button type="button" class="btn primary card-dialog-synth" data-bind="card-dialog-synth" disabled></button>
    <!--
      兑换动态卡面（HR）：只有「配了动态卡面、且还没解锁」的卡才显示这个按钮。
      用户 2026-09-19：「使用 20 张 HR 碎片，即可兑换对应卡牌的 HR 动态卡面」。
      碎片个数与可用性由 page/draw.js 的 canUnlockHr 判定（与服务端同一份规则）。
    -->
    <button type="button" class="btn card-dialog-hr" data-bind="card-dialog-hr" hidden></button>
    <!--
      兑换红碎工艺：只有「UR/SP + 已经拥有这张卡的全闪 + 还没红碎」的卡才显示。
      用户 2026-09-22：「在拥有相应卡牌的全闪工艺 UR/SP 之后，可以在图鉴中点开大图
      之后，点击红碎按钮，消耗 30/50 点 HR 碎片兑换对应的红碎工艺」。
      价目与可用性由 page/draw.js 的 canExchangeShatter 判定（与服务端同一份规则）。
    -->
    <button type="button" class="btn card-dialog-shatter" data-bind="card-dialog-shatter" hidden></button>
    <div class="card-dialog-hint" data-bind="card-dialog-hint"></div>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-bind="card-dialog-close">关闭</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="assets/shards.js?v=dfa3ce2b"></script>
<script src="assets/reveal.js?v=5e4b22cb"></script>

</body>
